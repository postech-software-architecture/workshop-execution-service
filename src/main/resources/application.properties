spring.application.name=execucao-service
server.port=8080
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=4
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.dynamic=false
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo,rabbit,consumer
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=ecs
foundation.queue=execucao-service.inbox
foundation.kind=execution
foundation.jwt-secret=${JWT_SECRET}
foundation.identity-url=${IDENTITY_URL:http://os:8080}
foundation.service-token=${SERVICE_TOKEN}
foundation.faults=${FAULT_TEST:false}
spring.data.mongodb.uri=${MONGO_URI}

management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=30s
