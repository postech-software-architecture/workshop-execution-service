apiVersion: apps/v1
kind: Deployment
metadata:
  name: execucao-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: execucao-service}
  template:
    metadata:
      labels: {app: execucao-service}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: app
          image: workshop-execution-service:REPLACE_WITH_COMMIT
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: execucao-service-settings}
            - secretRef: {name: execucao-service-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            failureThreshold: 40
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 640Mi}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: execucao-service}
spec:
  selector: {app: execucao-service}
  ports: [{port: 8080, targetPort: 8080}]
